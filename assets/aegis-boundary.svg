<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d"><title id="t">AEGIS-Q authority boundary</title><desc id="d">Genesis submits an action request. A trusted policy and authorization layer evaluates identity, scope, and revocation before execution is allowed or denied.</desc><rect width="1000" height="330" rx="22" fill="#f4f1e8"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="92" width="230" height="125" rx="16" fill="#263b30"/><rect x="385" y="70" width="230" height="170" rx="16" fill="#405b48" stroke="#b28a50" stroke-width="4"/><rect x="715" y="92" width="230" height="125" rx="16" fill="#263b30"/><g fill="#f4f1e8" font-size="23" font-weight="700"><text x="170" y="140">Genesis</text><text x="170" y="174">REQUESTS</text><text x="500" y="126">Trusted policy</text><text x="500" y="158">+ authorization</text><text x="500" y="190" font-size="17">identity · scope · revocation</text><text x="830" y="140">Execution</text><text x="830" y="174">ONLY IF ALLOWED</text></g><g stroke="#b28a50" stroke-width="5" fill="none" stroke-linecap="round"><path d="M295 154h80m-15 -12 15 12 -15 12M625 154h80m-15 -12 15 12 -15 12"/></g><g fill="#8b6a37" font-family="Arial,sans-serif" font-size="17" text-anchor="middle"><text x="500" y="285">The model cannot approve its own request.</text></g></g></svg>