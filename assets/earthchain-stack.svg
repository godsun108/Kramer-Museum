<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img" aria-labelledby="t d"><title id="t">EarthChain and TruFusion conceptual layers</title><desc id="d">A conceptual stack showing user experiences, identity and wallet, durable records and consensus, and security and governance.</desc><rect width="1000" height="370" rx="22" fill="#f4f1e8"/><g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="170" y="35" width="660" height="65" rx="12" fill="#405b48"/><rect x="170" y="115" width="660" height="65" rx="12" fill="#344b3b"/><rect x="170" y="195" width="660" height="65" rx="12" fill="#263b30"/><rect x="170" y="275" width="660" height="65" rx="12" fill="#18251e"/></g><g fill="#f4f1e8" font-size="22" font-weight="700"><text x="500" y="76">Experiences · creators · community</text><text x="500" y="156">Digital identity · wallet concepts</text><text x="500" y="236">Persistence · records · consensus</text><text x="500" y="316">Security · governance · recovery</text></g><g fill="#8b6a37" font-size="15"><text x="500" y="359">CONCEPTUAL ARCHITECTURE — NOT A CLAIM OF LIVE MAINNET</text></g></g></svg>