<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d"><title id="t">Genesis system concept</title><desc id="d">A conceptual flow from human intent through Genesis reasoning, a trusted authority boundary, and an execution environment, with feedback and audit.</desc><rect width="1000" height="330" rx="22" fill="#f4f1e8"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#263b30"><rect x="35" y="92" width="190" height="112" rx="14"/><rect x="285" y="92" width="190" height="112" rx="14"/><rect x="535" y="92" width="190" height="112" rx="14"/><rect x="785" y="92" width="180" height="112" rx="14"/></g><g fill="#f4f1e8" font-size="22" font-weight="700"><text x="130" y="137">Human</text><text x="130" y="166">intent</text><text x="380" y="137">Genesis</text><text x="380" y="166">reasoning</text><text x="630" y="137">Trusted</text><text x="630" y="166">policy gate</text><text x="875" y="137">Controlled</text><text x="875" y="166">execution</text></g><g stroke="#b28a50" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M230 148h45m-12 -12 12 12 -12 12M480 148h45m-12 -12 12 12 -12 12M730 148h45m-12 -12 12 12 -12 12"/></g><g fill="#667064" font-size="16"><text x="500" y="45">CONCEPTUAL RESPONSIBILITY FLOW</text><text x="500" y="260">Requests are evaluated outside the model.</text><text x="500" y="286">Denied or revoked actions do not proceed to execution.</text></g></g></svg>